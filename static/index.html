<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Distillery</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist:wght@400;600&display=swap" rel="stylesheet">
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          primary: "#adc6ff",
          "primary-fixed": "#d8e2ff",
          "primary-container": "#4d8eff",
          secondary: "#4edea3",
          "secondary-fixed": "#6ffbbe",
          tertiary: "#c0c1ff",
          background: "#111317",
          surface: "#111317",
          "surface-container": "#1e2024",
          "surface-container-high": "#282a2e",
          "surface-variant": "#333539",
          "on-surface": "#e2e2e8",
          "on-surface-variant": "#c2c6d6",
          outline: "#8c909f",
          "outline-variant": "#424754",
          error: "#ffb4ab",
        },
        borderRadius: { DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px" },
        spacing: {
          "max-width": "760px",
          gutter: "24px",
          "padding-panel": "32px",
          "stack-sm": "8px",
          "margin-page": "40px",
          "stack-md": "16px",
          "stack-lg": "32px",
        },
        fontFamily: { sans: ["Inter"], code: ["Geist"] },
        fontSize: {
          "body-sm": ["14px", { lineHeight: "20px", fontWeight: "400" }],
          "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }],
          "display-lg": ["40px", { lineHeight: "48px", letterSpacing: "-0.02em", fontWeight: "700" }],
          "label-caps": ["12px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "600" }],
          "title-md": ["18px", { lineHeight: "26px", fontWeight: "500" }],
          code: ["13px", { lineHeight: "20px", fontWeight: "400" }],
        },
      },
    },
  };
</script>
<style>
  * { box-sizing: border-box; }
  body { background: #111317; }

  .hidden { display: none !important; }

  @keyframes fadeUp { from { opacity: 0; transform: translate3d(0, 16px, 0); } to { opacity: 1; transform: translate3d(0, 0, 0); } }
  .fade-up { animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both; }

  /* Ambient aurora backdrop — pure CSS, no external image/WebGL dependency */
  .aurora-bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: #111317; }
  .aurora-bg::before, .aurora-bg::after {
    content: ""; position: absolute; width: 60vw; height: 60vw; max-width: 720px; max-height: 720px;
    border-radius: 50%; filter: blur(90px); opacity: 0.28; will-change: transform;
  }
  .aurora-bg::before { background: radial-gradient(circle, #3b82f6, transparent 70%); top: -15%; left: -15%; animation: auroraA 34s ease-in-out infinite alternate; }
  .aurora-bg::after { background: radial-gradient(circle, #10b981, transparent 70%); bottom: -20%; right: -10%; animation: auroraB 40s ease-in-out infinite alternate; }
  @keyframes auroraA { from { transform: translate(0, 0); } to { transform: translate(8%, 12%); } }
  @keyframes auroraB { from { transform: translate(0, 0); } to { transform: translate(-6%, -10%); } }
  @media (prefers-reduced-motion: reduce) {
    .aurora-bg::before, .aurora-bg::after { animation: none; }
    .fade-up { animation: none; }
  }

  .glass-panel {
    background: rgba(17, 19, 23, 0.5);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid transparent;
    background-image: linear-gradient(rgba(17, 19, 23, 0.5), rgba(17, 19, 23, 0.5)),
      linear-gradient(135deg, rgba(255,255,255,0.18) 0%, rgba(255,255,255,0.04) 100%);
    background-origin: border-box;
    background-clip: padding-box, border-box;
    box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.08), 0 4px 24px -8px rgba(0,0,0,0.5);
  }

  .glass-input {
    background: rgba(0, 0, 0, 0.22);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.1);
    color: #e2e2e8;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .glass-input:focus, .glass-input:focus-within {
    outline: none;
    border-color: rgba(173, 198, 255, 0.5);
    box-shadow: 0 0 20px rgba(173, 198, 255, 0.12), inset 0 0 15px rgba(173, 198, 255, 0.05);
  }
  .glass-input::placeholder { color: rgba(194, 198, 214, 0.45); }
  input[type="checkbox"] { accent-color: #adc6ff; }
  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button {
    filter: invert(1) brightness(0.6);
    opacity: 0.6;
    cursor: pointer;
  }

  .glass-button-primary {
    background: rgba(173, 198, 255, 0.16);
    border: 1px solid rgba(173, 198, 255, 0.35);
    box-shadow: 0 0 15px rgba(173, 198, 255, 0.18);
    position: relative; overflow: hidden;
    transition: box-shadow 0.3s ease, background 0.3s ease;
  }
  .glass-button-primary::before {
    content: ""; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
    background: linear-gradient(to right, transparent, rgba(255,255,255,0.2), transparent);
    transform: skewX(-25deg); transition: left 0.5s ease;
  }
  .glass-button-primary:hover:not(:disabled) { box-shadow: 0 0 25px rgba(173, 198, 255, 0.3); background: rgba(173, 198, 255, 0.22); }
  .glass-button-primary:hover:not(:disabled)::before { left: 200%; }
  .glass-button-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .glass-button {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
    color: #e2e2e8;
    transition: background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
  }
  .glass-button:hover:not(:disabled) { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.24); }
  .glass-button:disabled { opacity: 0.5; cursor: not-allowed; }

  .glass-toggle { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.06); box-shadow: inset 0 2px 5px rgba(0,0,0,0.4); position: relative; }
  .toggle-indicator {
    position: absolute; top: 4px; left: 4px; bottom: 4px; width: calc(50% - 4px);
    background: rgba(173, 198, 255, 0.2); border: 1px solid rgba(173, 198, 255, 0.4);
    box-shadow: 0 2px 10px rgba(173, 198, 255, 0.15); border-radius: 9999px;
    transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); pointer-events: none;
  }
  .glass-toggle:has(#mode-dataset.active) .toggle-indicator { transform: translateX(100%); }
  .glass-toggle button { position: relative; z-index: 1; color: #c2c6d6; transition: color 0.3s ease; }
  .glass-toggle button.active { color: #adc6ff; }

  details.filters summary { list-style: none; cursor: pointer; }
  details.filters summary::-webkit-details-marker { display: none; }
  details.filters[open] .chevron { transform: rotate(180deg); }
  .chevron { transition: transform 0.3s ease; }

  .progress-bar-container { background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.1); border-radius: 9999px; overflow: hidden; height: 10px; position: relative; }
  .progress-bar-fill { background: linear-gradient(90deg, #4f8cff, #33d69f); box-shadow: 0 0 16px 0 rgba(173,198,255,0.4); height: 100%; width: 0%; border-radius: 9999px; transition: width 0.4s cubic-bezier(0.4,0,0.2,1); position: relative; overflow: hidden; }
  .progress-bar-fill .shimmer { position: absolute; top: 0; left: -100%; width: 50%; height: 100%; background: linear-gradient(to right, transparent, rgba(255,255,255,0.6), transparent); animation: shimmerSweep 2s infinite linear; }
  @keyframes shimmerSweep { 100% { left: 200%; } }

  .msg-box { border-radius: 12px; padding: 14px 16px; font-size: 13px; line-height: 1.5; }
  .msg-box.error { background: rgba(255, 180, 171, 0.1); border: 1px solid rgba(255, 180, 171, 0.3); color: #ffb4ab; }
  .msg-box.info { background: rgba(78, 222, 163, 0.1); border: 1px solid rgba(78, 222, 163, 0.3); color: #4edea3; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 9999px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.25); }

  /* --- Dynamically-rendered result cards (created by app.js) --- */
  .masonry-grid { column-count: 1; column-gap: 16px; }
  @media (min-width: 640px) { .masonry-grid { column-count: 2; } }
  @media (min-width: 1024px) { .masonry-grid { column-count: 3; } }

  @keyframes cardIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
  .card {
    display: block; break-inside: avoid; margin-bottom: 16px; position: relative;
    background: rgba(30, 32, 36, 0.6);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid transparent;
    background-image: linear-gradient(rgba(30,32,36,0.6), rgba(30,32,36,0.6)), linear-gradient(to bottom right, rgba(255,255,255,0.14), rgba(255,255,255,0.02));
    background-origin: border-box; background-clip: padding-box, border-box;
    box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.08);
    border-radius: 12px; overflow: hidden; font-size: 12px;
    transition: box-shadow 0.3s ease, transform 0.3s ease, opacity 0.3s ease, filter 0.3s ease;
    animation: cardIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .card:hover { box-shadow: inset 0 1px 0 0 rgba(255,255,255,0.16), 0 0 20px 0 rgba(173,198,255,0.15); transform: translateY(-2px); }
  .card img { width: 100%; height: 140px; object-fit: cover; display: block; background: #000; }
  .card.discarded { opacity: 0.4; filter: grayscale(75%); transform: scale(0.98); }
  .card.discarded:hover { transform: scale(0.98); }

  .discard-btn {
    position: absolute; top: 8px; right: 8px; z-index: 2;
    background: rgba(17,19,23,0.75); backdrop-filter: blur(8px);
    color: #e2e2e8; border: 1px solid rgba(255,255,255,0.14);
    border-radius: 9999px; font-size: 11px; font-weight: 600;
    padding: 5px 10px; cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }
  .discard-btn:hover { background: rgba(255,180,171,0.25); border-color: rgba(255,180,171,0.5); color: #ffb4ab; }
  .card.discarded .discard-btn { background: rgba(173,198,255,0.2); border-color: rgba(173,198,255,0.4); color: #adc6ff; }

  .download-btn {
    position: absolute; top: 8px; left: 8px; z-index: 2;
    width: 26px; height: 26px; display: flex; align-items: center; justify-content: center;
    background: rgba(17,19,23,0.7); backdrop-filter: blur(8px);
    color: #e2e2e8; border: 1px solid rgba(255,255,255,0.12);
    border-radius: 9999px; font-size: 12px; text-decoration: none;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .download-btn:hover { background: rgba(173,198,255,0.3); color: #adc6ff; }

  .card .body { padding: 10px 12px 12px; }
  .card .title { font-weight: 600; margin-bottom: 4px; max-height: 34px; overflow: hidden; color: #e2e2e8; }
  .card .meta { color: #8c909f; font-size: 11px; }
  .badge { display: inline-block; font-size: 10px; background: rgba(173,198,255,0.15); color: #adc6ff; padding: 2px 7px; border-radius: 9999px; margin-right: 4px; }
</style>
</head>
<body class="text-on-surface antialiased overflow-x-hidden min-h-screen relative">
<div class="aurora-bg" aria-hidden="true"></div>

<header class="glass-panel flex items-center gap-3 px-6 py-4 mx-4 mt-4 rounded-xl md:mx-auto md:max-w-max-width fade-up">
  <img src="/logo.svg" alt="Distillery logo" class="w-8 h-8 flex-shrink-0">
  <div class="flex items-baseline gap-3 flex-wrap">
    <h1 class="text-title-md font-semibold text-primary tracking-tight">Distillery</h1>
    <span class="text-body-sm text-on-surface-variant opacity-80">distill web data into a labeled ML dataset from a plain-English condition</span>
  </div>
</header>

<main class="w-full max-w-max-width mx-auto px-gutter py-margin-page flex flex-col gap-stack-lg relative z-10">

  <!-- Condition input -->
  <section class="glass-panel rounded-xl p-padding-panel flex flex-col gap-stack-md fade-up" style="animation-delay:0.05s">
    <div class="glass-input rounded-lg relative overflow-hidden">
      <label class="sr-only" for="condition">Describe what you want in plain English</label>
      <textarea id="condition" class="w-full h-28 bg-transparent border-none text-on-surface text-body-lg p-4 focus:ring-0 relative z-10 block resize-none"></textarea>
      <div id="placeholder-overlay" class="absolute inset-0 pointer-events-none p-4 text-body-lg text-on-surface-variant/50 z-0">
        <span id="typewriter"></span>
      </div>
    </div>

    <div class="flex flex-col md:flex-row justify-between items-center gap-stack-md">
      <div class="glass-toggle rounded-full p-1 flex items-center w-full md:w-auto h-11">
        <div class="toggle-indicator"></div>
        <button type="button" id="mode-preview" class="active flex-1 md:w-36 h-full text-label-caps uppercase tracking-wide">Quick preview</button>
        <button type="button" id="mode-dataset" class="flex-1 md:w-36 h-full text-label-caps uppercase tracking-wide">Build dataset</button>
      </div>
      <div class="flex flex-col sm:flex-row sm:items-center gap-2 sm:gap-3 w-full md:w-auto sm:justify-end">
        <span id="parse-status" class="text-body-sm text-on-surface-variant order-2 sm:order-1 sm:text-right"></span>
        <button type="button" id="parse-btn" class="glass-button-primary rounded-full px-6 py-3 text-label-caps uppercase tracking-wide text-primary-fixed whitespace-nowrap flex-shrink-0 order-1 sm:order-2">Parse condition</button>
      </div>
    </div>
    <div id="parse-error" class="msg-box error hidden"></div>
  </section>

  <!-- Parsed filters -->
  <section id="filters-panel" class="glass-panel rounded-xl p-padding-panel flex flex-col gap-stack-md hidden fade-up">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-stack-md">
      <div class="flex flex-col gap-2">
        <label class="text-label-caps uppercase text-outline" for="f-data-type">Data type</label>
        <select id="f-data-type" class="glass-input rounded-lg px-3 py-2 text-body-sm appearance-none w-full">
          <option value="image">image</option>
          <option value="text">text</option>
          <option value="structured">structured</option>
        </select>
      </div>
      <div class="flex flex-col gap-2">
        <label class="text-label-caps uppercase text-outline" for="f-count">Count</label>
        <input type="number" id="f-count" min="1" max="1000" class="glass-input rounded-lg px-3 py-2 text-body-sm w-full">
      </div>
      <div class="flex flex-col gap-2">
        <label class="text-label-caps uppercase text-outline" for="f-label">Dataset label</label>
        <input type="text" id="f-label" class="glass-input rounded-lg px-3 py-2 text-body-sm w-full">
      </div>
    </div>
    <div class="flex flex-col gap-2">
      <label class="text-label-caps uppercase text-outline" for="f-keywords">Keywords (comma separated)</label>
      <input type="text" id="f-keywords" class="glass-input rounded-lg px-3 py-2 text-body-sm w-full">
    </div>

    <details class="filters">
      <summary class="flex items-center justify-between py-2 text-on-surface-variant hover:text-primary transition-colors">
        <span class="text-label-caps uppercase tracking-wide flex items-center gap-2">
          <span class="material-symbols-outlined text-[18px]">tune</span>
          Advanced filters (power users)
        </span>
        <span class="material-symbols-outlined chevron">expand_more</span>
      </summary>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-stack-md mt-stack-md bg-black/15 rounded-lg p-stack-md border border-white/5">
        <div class="flex flex-col gap-2">
          <label class="text-label-caps uppercase text-outline" for="f-resolution">Resolution</label>
          <select id="f-resolution" class="glass-input rounded-lg px-3 py-2 text-body-sm appearance-none w-full">
            <option value="">any</option>
            <option value="low">low</option>
            <option value="medium">medium</option>
            <option value="high">high</option>
          </select>
        </div>
        <div class="flex flex-col gap-2">
          <label class="text-label-caps uppercase text-outline" for="f-orientation">Orientation</label>
          <select id="f-orientation" class="glass-input rounded-lg px-3 py-2 text-body-sm appearance-none w-full">
            <option value="">any</option>
            <option value="landscape">landscape</option>
            <option value="portrait">portrait</option>
            <option value="square">square</option>
          </select>
        </div>
        <div class="flex flex-col gap-2">
          <label class="text-label-caps uppercase text-outline" for="f-language">Language</label>
          <input type="text" id="f-language" placeholder="en" class="glass-input rounded-lg px-3 py-2 text-body-sm w-full">
        </div>
        <div class="flex flex-col gap-2">
          <label class="text-label-caps uppercase text-outline">Date range</label>
          <div class="flex items-center gap-2">
            <input type="text" id="f-date-from" placeholder="YYYY-MM-DD" class="glass-input rounded-lg px-3 py-2 text-body-sm w-full">
            <span class="text-outline">-</span>
            <input type="text" id="f-date-to" placeholder="YYYY-MM-DD" class="glass-input rounded-lg px-3 py-2 text-body-sm w-full">
          </div>
        </div>
        <div class="flex flex-col gap-2 md:col-span-2">
          <label class="text-label-caps uppercase text-outline" for="f-domains">Domain allowlist (comma separated, narrows scraper fallback only)</label>
          <input type="text" id="f-domains" placeholder="example.com, another.org" class="glass-input rounded-lg px-3 py-2 text-body-sm w-full">
        </div>
        <label class="flex items-center gap-2 cursor-pointer md:col-span-2">
          <input type="checkbox" id="f-no-watermark" class="w-4 h-4">
          <span class="text-body-sm text-on-surface-variant">No watermarks</span>
        </label>
        <label class="flex items-start gap-2 cursor-pointer md:col-span-2">
          <input type="checkbox" id="f-dedupe-across-runs" class="w-4 h-4 mt-0.5">
          <span class="text-body-sm text-on-surface-variant">Skip anything I've ever fetched before, in any run (off by default — a repeated/refined query can otherwise return far fewer results, since sources return the same top matches each time)</span>
        </label>
      </div>
    </details>

    <div class="flex justify-end mt-stack-sm">
      <button type="button" id="fetch-btn" class="glass-button-primary rounded-full px-8 py-3 text-title-md text-primary-fixed flex items-center gap-2">
        Start fetch
        <span class="material-symbols-outlined text-[20px]">rocket_launch</span>
      </button>
    </div>
  </section>

  <!-- Live fetch progress -->
  <section id="progress-panel" class="glass-panel rounded-xl p-padding-panel flex flex-col gap-stack-md hidden fade-up">
    <div class="flex justify-between items-center">
      <span id="progress-label" class="text-body-sm text-primary">Fetching...</span>
      <span id="progress-count" class="text-title-md font-code">0 / 0</span>
    </div>
    <div class="progress-bar-container">
      <div id="progress-bar" class="progress-bar-fill"><div class="shimmer"></div></div>
    </div>
    <div class="flex justify-center">
      <button type="button" id="stop-btn" class="glass-button rounded-full px-6 py-2.5 text-body-sm flex items-center gap-2 hidden">
        <span class="material-symbols-outlined text-[18px]">stop_circle</span>
        Stop fetch
      </button>
    </div>
    <div id="fetch-error" class="msg-box hidden"></div>
  </section>

  <!-- Results -->
  <section id="results-panel" class="flex flex-col gap-stack-md hidden fade-up">
    <div class="glass-panel rounded-full px-6 py-3 flex flex-wrap items-center justify-between gap-3">
      <span id="results-summary" class="text-body-sm text-on-surface-variant"></span>
      <button type="button" id="topup-btn" class="glass-button rounded-full px-5 py-2 text-label-caps uppercase tracking-wide text-primary hidden"></button>
    </div>

    <div id="results-grid" class="masonry-grid"></div>

    <div id="export-section" class="glass-panel rounded-xl p-padding-panel hidden flex flex-col gap-stack-md">
      <div class="grid grid-cols-2 md:grid-cols-5 gap-stack-md items-end">
        <div class="flex flex-col gap-2">
          <label class="text-label-caps uppercase text-outline">Train %</label>
          <input type="number" id="split-train" value="80" class="glass-input rounded-lg px-3 py-2 text-body-sm w-full">
        </div>
        <div class="flex flex-col gap-2">
          <label class="text-label-caps uppercase text-outline">Val %</label>
          <input type="number" id="split-val" value="10" class="glass-input rounded-lg px-3 py-2 text-body-sm w-full">
        </div>
        <div class="flex flex-col gap-2">
          <label class="text-label-caps uppercase text-outline">Test %</label>
          <input type="number" id="split-test" value="10" class="glass-input rounded-lg px-3 py-2 text-body-sm w-full">
        </div>
        <div class="flex flex-col gap-2">
          <label class="text-label-caps uppercase text-outline">Resize W</label>
          <input type="number" id="resize-w" placeholder="e.g. 256" class="glass-input rounded-lg px-3 py-2 text-body-sm w-full">
        </div>
        <div class="flex flex-col gap-2">
          <label class="text-label-caps uppercase text-outline">Resize H</label>
          <input type="number" id="resize-h" placeholder="e.g. 256" class="glass-input rounded-lg px-3 py-2 text-body-sm w-full">
        </div>
      </div>
      <div class="flex flex-wrap items-center justify-between gap-3 mt-stack-sm">
        <span id="export-status" class="text-body-sm text-on-surface-variant"></span>
        <button type="button" id="export-btn" class="glass-button-primary rounded-full px-8 py-3 text-title-md text-primary-fixed flex items-center gap-2">
          <span class="material-symbols-outlined text-[20px]">download</span>
          Download dataset (.zip)
        </button>
      </div>
    </div>
  </section>

</main>

<footer class="text-center text-on-surface-variant text-body-sm opacity-70 py-10 px-4">
  Local tool — respects robots.txt and each API's rate limits. Check per-item license/attribution before training use.
</footer>

<script src="/app.js"></script>
<script>
  // Purely decorative rotating placeholder — never touches the textarea's
  // real value, so it can't interfere with app.js's own logic.
  (function () {
    const textarea = document.getElementById("condition");
    const overlay = document.getElementById("placeholder-overlay");
    const typewriter = document.getElementById("typewriter");
    const prompts = [
      "50 high-resolution photos of red sports cars from the side, no watermarks",
      "A dataset of minimalist interior design photos",
      "Headlines and snippets about recent AI research",
      "A table of countries by population from Wikipedia",
    ];
    let promptIndex = 0, charIndex = 0, isDeleting = false;

    function tick() {
      if (textarea.value.length > 0) { setTimeout(tick, 400); return; }
      const current = prompts[promptIndex];
      typewriter.textContent = current.substring(0, charIndex);
      let delay = isDeleting ? 25 : 45;
      if (!isDeleting) {
        charIndex++;
        if (charIndex > current.length) { isDeleting = true; delay = 1800; }
      } else {
        charIndex--;
        if (charIndex < 0) { isDeleting = false; charIndex = 0; promptIndex = (promptIndex + 1) % prompts.length; delay = 400; }
      }
      setTimeout(tick, delay);
    }
    setTimeout(tick, 600);

    textarea.addEventListener("input", () => {
      overlay.style.display = textarea.value.length > 0 ? "none" : "block";
    });
  })();
</script>
